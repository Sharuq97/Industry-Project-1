<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmRockers - Explore Movies with TMDB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Section -->
  <header>
    <div class="logo-container">
      <a href="/" class="logo">FILMROCKERS</a>
    </div>
    <form id="form" class="search-container">
      <input type="text" id="search" class="search" placeholder="Search for movies...">
      <button type="submit" class="search-btn">Go</button>
    </form>
  </header>

  <!-- Main content section where movies will dynamically render -->
  <main id="main"></main>

  <!-- Pagination Controls -->
  <div class="pagination" id="pagination"></div>

  <!-- Link to Script -->
  <script src="script.js" type="module"></script>
</body>
</html>
