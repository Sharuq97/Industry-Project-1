<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FilmRockers - Explore Movies with TMDB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Section -->
  <header>
    <div class="logo-container">
      <a href="/" class="logo">FILMROCKERS</a>
    </div>
    <form id="form" class="search-container">
      <input type="text" id="search" class="search" placeholder="Search for movies...">
      <button type="submit" class="search-btn">Go</button>
    </form>
  </header>

  <!-- Main content section where movies will dynamically render -->
  <main id="main"></main>

  <!-- Pagination Controls -->
  <div class="pagination" id="pagination"></div>

  <!-- My Watchlist Section -->
<section id="watchlist-section">
  <h2>My Watchlist</h2>
  
  <!-- Watchlist Table -->
  <table id="watchlist-table">
    <tbody>
      <!-- Watchlist items will be dynamically populated here -->
    </tbody>
  </table>

  <!-- Add Movie Form -->
  <form id="add-movie-form" class="add-movie-form">
    <input type="text" id="movie-title" placeholder="Movie Title" required>

    <button type="submit" class="add-btn">Add to Watchlist</button>
  </form>
</section>

<!-- Update and Delete Action Buttons (hidden by default) -->
<div id="action-buttons" style="display: none;">
  <button id="update-btn" class="update-btn">Update</button>
  <button id="delete-btn" class="delete-btn">Delete</button>
</div>


  <!-- Link to Script -->
  <script src="script.js" type="module"></script>
</body>
</html>
